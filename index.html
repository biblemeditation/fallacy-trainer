<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="논리학 오류 31개를 시험 형식(논제와 보기 매칭)으로 연습하는 학습 앱. 말풍선 해설, 간격 반복 복습, 약점 리포트.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171c26" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a47c4'/%3E%3Cpath d='M9 10h14M9 16h9M9 22h12' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>논리 오류 매칭</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;600&display=swap">
<style>
/* Layout: one reading column (max 760px) like an exam sheet; passages set in serif like a printed test,
   UI in a plain sans, numbers/labels in mono. Ink-blue accent, highlighter yellow for cues. */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --surface-2: #f7f8fb;
  --ink: #1a2232;
  --muted: #5a6476;
  --line: #dde2ea;
  --line-strong: #c3cad6;
  --accent: #2a47c4;
  --accent-ink: #ffffff;
  --accent-soft: #e7ecfb;
  --mark: #ffe24f;
  --mark-ink: #1a2232;
  --ok: #1d7f55;
  --ok-soft: #e2f3ea;
  --bad: #c2372d;
  --bad-soft: #fbe6e3;
  --mid: #b07a06;
  --mid-soft: #fbf0d6;
  --none: #d4d9e2;
  --shadow: 0 1px 2px rgba(20, 30, 60, .06), 0 6px 20px rgba(20, 30, 60, .06);
  --f-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-text: "Noto Serif KR", "AppleMyungjo", "Batang", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
  --step--1: .8125rem;
  --step-0: .9375rem;
  --step-1: 1.0625rem;
  --step-2: 1.3rem;
  --step-3: 1.7rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f131b; --surface: #171c26; --surface-2: #1c2230; --ink: #e6e9ef; --muted: #9aa3b3;
    --line: #2a3141; --line-strong: #3a4357; --accent: #8199ff; --accent-ink: #0f131b; --accent-soft: #1e2748;
    --mark: rgba(255, 214, 0, .32); --mark-ink: #fff6c8; --ok: #4cc38a; --ok-soft: #12291f; --bad: #ff7b6f; --bad-soft: #321716;
    --mid: #e6b443; --mid-soft: #2e2510; --none: #343c4d; --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f131b; --surface: #171c26; --surface-2: #1c2230; --ink: #e6e9ef; --muted: #9aa3b3;
  --line: #2a3141; --line-strong: #3a4357; --accent: #8199ff; --accent-ink: #0f131b; --accent-soft: #1e2748;
  --mark: rgba(255, 214, 0, .32); --mark-ink: #fff6c8; --ok: #4cc38a; --ok-soft: #12291f; --bad: #ff7b6f; --bad-soft: #321716;
  --mid: #e6b443; --mid-soft: #2e2510; --none: #343c4d; --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: var(--step-0); line-height: 1.6; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
h1, h2, h3 { text-wrap: balance; line-height: 1.3; margin: 0; }
p { margin: 0; }
.num, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* ── top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 10px; min-height: 52px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-back { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; width: 34px; height: 34px; font-size: 18px; line-height: 1; }
.brand { font-weight: 600; color: var(--ink); text-decoration: none; white-space: nowrap; }
.brand b { color: var(--accent); font-weight: 700; }
.bar-title { color: var(--muted); font-size: var(--step--1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.bar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.dday { font-family: var(--f-mono); font-weight: 600; font-size: var(--step--1); color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 999px; }
.save { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
.save i { width: 7px; height: 7px; border-radius: 50%; background: var(--none); display: inline-block; }
.save[data-mode="cloud"] i { background: var(--ok); }
.save[data-mode="local"] i { background: var(--mid); }
.save[data-mode="memory"] i { background: var(--bad); }

/* ── page column */
.wrap { max-width: 760px; margin: 0 auto; padding-block: 20px 120px; display: flex; flex-direction: column; gap: 18px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.loading { color: var(--muted); }
.eyebrow { font-size: 12.5px; font-weight: 600; letter-spacing: .01em; color: var(--muted); }
.h1 { font-size: var(--step-3); font-weight: 700; }
.h2 { font-size: var(--step-2); font-weight: 700; }
.h3 { font-size: var(--step-1); font-weight: 600; }
.lead { color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: var(--step--1); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.spacer { flex: 1; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.panel.tight { padding: 14px; }

/* ── buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--surface);
  border-radius: 8px; padding: 9px 14px; font-weight: 500; min-height: 40px; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.block { width: 100%; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 7px 12px; min-height: 36px; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
select, input[type="date"], input[type="number"], textarea { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 7px 10px; min-height: 38px; max-width: 100%; }
textarea { width: 100%; min-height: 110px; font-family: var(--f-mono); font-size: 12px; }
label.check { display: inline-flex; gap: 8px; align-items: center; }
.badge { display: inline-flex; align-items: center; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--muted); white-space: nowrap; }
.badge.note { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.badge.ok { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); }
.badge.bad { border-color: var(--bad); color: var(--bad); background: var(--bad-soft); }

/* ── home */
.today { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; }
.today .big { font-family: var(--f-mono); font-size: var(--step-3); font-weight: 600; line-height: 1; }
.today .stats { display: flex; gap: 22px; flex-wrap: wrap; }
.today .stats div { display: flex; flex-direction: column; gap: 4px; }
.map { display: grid; gap: 10px; }
.map-row { display: grid; grid-template-columns: 66px 1fr; gap: 10px; align-items: start; }
.map-cat { font-size: var(--step--1); font-weight: 600; color: var(--muted); padding-top: 5px; }
.map-cells { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.cell { border: 1px solid var(--line); background: var(--surface-2); border-radius: 6px; padding: 3px 8px 3px 6px; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; }
.cell::before { content: ""; width: 9px; height: 9px; border-radius: 3px; background: var(--none); flex-shrink: 0; }
.cell[data-level="low"]::before { background: var(--bad); }
.cell[data-level="mid"]::before { background: var(--mid); }
.cell[data-level="high"]::before { background: var(--ok); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; gap: 5px; align-items: center; }
.legend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; background: var(--none); }
.modes { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.mode { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: var(--ink); min-width: 0; }
.mode:hover { border-color: var(--accent); }
.mode b { font-size: var(--step-1); }
.mode span { font-size: var(--step--1); color: var(--muted); }
.mode.key { border-color: var(--accent); background: var(--accent-soft); }
.group-title { font-size: var(--step--1); font-weight: 600; color: var(--muted); margin-top: 6px; }

/* ── passage (exam text) */
.passage { font-family: var(--f-text); font-size: 1.02rem; line-height: 1.85; letter-spacing: -.005em; word-break: keep-all; overflow-wrap: anywhere; }
.passage mark { background: var(--mark); color: var(--mark-ink); padding: 0 2px; border-radius: 2px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.qmeta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: var(--step--1); color: var(--muted); }

/* ── choices (single question) */
.choices { display: grid; gap: 8px; }
.choice { text-align: left; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; min-height: 44px; }
.choice .k { font-family: var(--f-mono); font-weight: 600; color: var(--muted); width: 1.3em; flex-shrink: 0; }
.choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.choice.is-ok { border-color: var(--ok); background: var(--ok-soft); }
.choice.is-bad { border-color: var(--bad); background: var(--bad-soft); }
.choice:disabled { cursor: default; color: var(--ink); }

/* ── speech bubble */
.bubble { position: relative; margin-top: 12px; background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); animation: pop .16s ease-out; }
.bubble::before { content: ""; position: absolute; top: -8px; left: 28px; width: 14px; height: 14px; background: var(--surface-2); border-left: 1px solid var(--line-strong); border-top: 1px solid var(--line-strong); transform: rotate(45deg); }
.bubble .ans { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: baseline; }
.bubble .ans dt { font-size: 12px; color: var(--muted); font-weight: 600; }
.bubble .ans dd { margin: 0; font-weight: 600; }
.bubble .ans dd.ok { color: var(--ok); }
.bubble .ans dd.bad { color: var(--bad); text-decoration: line-through; text-decoration-thickness: 1px; }
.bubble h4 { margin: 0; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
.bubble p { line-height: 1.65; }
.bubble .foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
@keyframes pop { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .bubble { animation: none; } }

/* ── matching sheet */
.bogi { border: 1.5px solid var(--ink); border-radius: 4px; padding: 12px 14px 12px; position: relative; background: var(--surface); }
.bogi-title { position: absolute; top: -11px; left: 50%; transform: translateX(-50%); background: var(--surface); padding: 0 8px; font-weight: 600; font-size: var(--step--1); }
.bogi-list { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.bogi-list span { white-space: nowrap; font-size: var(--step--1); }
.bogi-list span.used { color: var(--muted); text-decoration: line-through; }
.bogi-list b { font-family: var(--f-mono); margin-right: 3px; }
.qrow { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 10px 12px; align-items: start; cursor: pointer; }
.qrow .qn { font-family: var(--f-mono); font-weight: 600; padding-top: 3px; }
.qrow .slot { min-width: 54px; min-height: 36px; border: 1.5px dashed var(--line-strong); border-radius: 8px; display: grid; place-items: center; font-family: var(--f-mono); font-weight: 600; background: var(--surface-2); }
.qrow.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.qrow.active .slot { border-color: var(--accent); border-style: solid; }
.qrow .slot.filled { border-style: solid; border-color: var(--ink); }
.qrow.is-ok .slot { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); }
.qrow.is-bad .slot { border-color: var(--bad); color: var(--bad); background: var(--bad-soft); }
.qrow .bubble { grid-column: 1 / -1; cursor: auto; }
.qrow .hint { grid-column: 2 / -1; font-size: 12px; color: var(--muted); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line-strong); box-shadow: 0 -8px 24px rgba(10, 20, 40, .12);
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet-in { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.sheet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.sheet-grid button { text-align: left; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 8px 10px; font-size: var(--step--1); display: flex; gap: 6px; align-items: center; min-height: 40px; }
.sheet-grid button b { font-family: var(--f-mono); }
.sheet-grid button:disabled { opacity: .4; text-decoration: line-through; }
.banner { border-radius: 8px; padding: 10px 12px; background: var(--accent-soft); border: 1px solid var(--accent); font-size: var(--step--1); }
.banner.ok { background: var(--ok-soft); border-color: var(--ok); }
.banner.bad { background: var(--bad-soft); border-color: var(--bad); }
.score { font-family: var(--f-mono); font-size: var(--step-3); font-weight: 600; }

/* ── cards */
.card-def { font-size: var(--step-1); line-height: 1.7; }
.signals { margin: 0; padding-left: 1.1em; display: grid; gap: 4px; }
.vs { display: grid; gap: 8px; }
.vs div { border-left: 3px solid var(--line-strong); padding-left: 10px; }
.vs b { display: block; font-size: var(--step--1); }

/* ── tables */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: var(--step--1); }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--surface-2); font-weight: 600; white-space: nowrap; }
td.name { font-weight: 600; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }

/* ── report bars */
.bars { display: grid; gap: 6px; }
.barrow { display: grid; grid-template-columns: minmax(96px, 150px) 1fr 64px; gap: 8px; align-items: center; font-size: var(--step--1); }
.barrow .track { height: 10px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.barrow .fill { height: 100%; background: var(--none); }
.barrow .fill[data-level="low"] { background: var(--bad); }
.barrow .fill[data-level="mid"] { background: var(--mid); }
.barrow .fill[data-level="high"] { background: var(--ok); }
.barrow .v { text-align: right; font-family: var(--f-mono); color: var(--muted); }

.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.symbol { font-family: var(--f-mono); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; display: inline-block; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: var(--step--1); }
.kv dt { color: var(--muted); font-weight: 600; }
.kv dd { margin: 0; }
.progressline { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progressline i { display: block; height: 100%; background: var(--accent); }

@media (max-width: 560px) {
  .today { grid-template-columns: 1fr; }
  .two { grid-template-columns: 1fr; }
  .map-row { grid-template-columns: 1fr; gap: 4px; }
  .map-cat { padding-top: 0; }
  .qrow { grid-template-columns: auto 1fr; }
  .qrow .slot { grid-column: 2; justify-self: start; }
  .barrow { grid-template-columns: 96px 1fr 52px; }
}

</style>
</head>
<body>
<header class="bar" id="bar">
  <div class="bar-in">
    <button class="bar-back" id="back" type="button" aria-label="홈으로" hidden>←</button>
    <a class="brand" href="#home">논리 오류 <b>매칭</b></a>
    <span class="bar-title" id="barTitle"></span>
    <span class="bar-right">
      <span class="dday" id="dday" hidden></span>
      <span class="save" id="save" title="저장 상태"><i></i><span id="saveText">저장</span></span>
    </span>
  </div>
</header>

<main class="wrap" id="view" aria-live="polite">
  <p class="loading">문제 은행을 불러오는 중…</p>
</main>

<div class="sheet" id="sheet" hidden></div>

<script>
/* 오류 분류 데이터: 범주 6, 오류 31, 헷갈림 묶음 10.
   정의는 노트의 "(교제)" 문구를 우선 사용하고(defNote:true), 노트에 정의가 없으면 보충(defNote:false). */
(function (g) {
  const FT = (g.FT = g.FT || {});

  FT.categories = [
    { id: 'language', name: '언어적 오류', short: '언어', note: '언어의 명료성 평가' },
    { id: 'premise', name: '전제 관련 오류', short: '전제', note: '전제의 수용가능성 평가' },
    { id: 'formal', name: '형식적 오류', short: '형식', note: '노트에서는 무관성의 오류 범주에서 함께 다룸' },
    { id: 'relevance', name: '무관성의 오류', short: '무관성', note: '전제와 결론의 연관성 평가 (= 심리적 오류)' },
    { id: 'inductive', name: '귀납 관련 오류', short: '귀납', note: '전제가 결론을 충분히 뒷받침하는가' },
    { id: 'etc', name: '기타 오류', short: '기타', note: '노트 부록의 기타 오류 목록' },
  ];

  FT.fallacies = [
    // ── 언어적 오류
    { id: 'equivocation', name: '애매어의 오류', aka: [], cat: 'language', defNote: true,
      def: '논증에 사용된 단어나 구절의 의미가 이중적인데, 그것을 무시하고 추론함으로써 발생하는 오류.',
      signal: ['같은 단어가 전제와 결론에서 서로 다른 뜻으로 쓰인다.', '"작은 코끼리 → 작은 동물"처럼 기준에 따라 뜻이 달라지는 단어도 포함.'],
      example: '모든 사람은 죄인이다. 그런데 죄인은 감옥에 가거나 벌금을 내야 한다. 그러므로 모든 사람은 감옥에 가거나 벌금을 내야 한다.' },
    { id: 'amphiboly', name: '애매문의 오류', aka: [], cat: 'language', defNote: true,
      def: '문장의 구조상 문장이 이중적인 의미로 해석될 수 있는데, 그것을 무시하고 추론함으로써 발생하는 오류.',
      signal: ['단어 뜻은 분명한데 문장 구조(수식 범위, 조사 "의", 대명사 "그")가 두 가지로 읽힌다.'],
      example: '철이는 자신이 서태지의 숭배자라고 말했다. 그러나 그 말은 사실이 아닐 것이다. 서태지가 철이를 숭배할 리가 없기 때문이다.' },
    { id: 'accent', name: '강조의 오류', aka: [], cat: 'language', defNote: true,
      def: '문장의 특정한 부분을 강조함으로써 달리 해석될 수 있는데, 이를 토대로 자의적으로 추론함으로써 발생하는 오류.',
      signal: ['"오늘은 ~하지 않았다"처럼 특정 부분이 강조되어, 원래 없던 함축(평소에는 그랬다)을 끌어낸다.'],
      example: '선원이 항해일지에 "오늘 선장은 술에 취하지 않았음"이라고 썼다. 이를 읽은 선주는 선장이 항해 중 자주 술에 취해 있었다고 추론했다.' },
    { id: 'composition', name: '합성의 오류', aka: [], cat: 'language', defNote: true,
      def: '전체를 구성하고 있는 부분이 어떤 성질을 가지고 있기 때문에 전체도 그러한 성질을 갖는다고 추론함으로써 발생하는 오류.',
      signal: ['부분(원소)의 성질 → 전체(집단)의 성질.'],
      example: '손흥민은 축구를 잘한다. 그러므로 한국은 축구를 잘한다.' },
    { id: 'division', name: '분할의 오류', aka: [], cat: 'language', defNote: true,
      def: '전체가 어떤 성질을 가지고 있기 때문에 전체를 구성하고 있는 부분도 그러한 성질을 갖는다고 추론함으로써 발생하는 오류.',
      signal: ['전체(집단)의 성질 → 부분(원소)의 성질.'],
      example: '우리나라의 지난해 수출량은 크게 증가했다. 신발도 수출품 중 하나이다. 그러므로 지난해 신발의 수출량도 크게 증가했을 것이다.' },

    // ── 전제 관련 오류
    { id: 'begging', name: '선결문제 요구의 오류', aka: ['순환논증의 오류', '논점 선취의 오류'], cat: 'premise', defNote: true,
      def: '근거가 제시되어야 할 주장을 근거로 삼는 오류. 증명해야 할 결론이 이미 전제 속에 들어가 있다.',
      signal: ['결론을 말만 바꿔 근거로 다시 쓴다.', '근거를 따라가 보면 결론으로 되돌아온다.'],
      example: '철구는 나를 좋아해. 철구가 그렇게 말했거든. 그리고 사람은 자기가 좋아하는 사람에게는 거짓말을 하지 않잖아.' },
    { id: 'false-dilemma', name: '흑백사고의 오류', aka: [], cat: 'premise', defNote: true,
      def: '반대 개념을 모순 개념으로 혼동하는 오류. 제3의 선택지(중립)가 있는데도 둘 중 하나뿐인 것처럼 다룬다.',
      signal: ['"~가 아니면 ~다"로 중간을 지운다.', '"지지하지 않으면 반대자(혐오주의자)"'],
      example: '너는 대기업 여성 채용 특별 우대 정책을 지지하지 않는다고? 그렇다면 너는 여성 혐오주의자구나.' },

    // ── 형식적 오류
    { id: 'deny-antecedent', name: '전건부정의 오류', aka: [], cat: 'formal', defNote: false,
      def: '"P이면 Q이다"와 "P가 아니다"로부터 "Q가 아니다"를 이끌어 내는 부당한 추론.',
      signal: ['P→Q, ~P ∴ ~Q', '조건문의 앞부분(전건)을 부정한다.'],
      example: '만일 그가 로또에 당첨된다면 그는 큰 파티를 열 것이다. 그는 로또에 당첨되지 않았다. 따라서 그는 큰 파티를 열지 않을 것이다.' },
    { id: 'affirm-consequent', name: '후건긍정의 오류', aka: [], cat: 'formal', defNote: false,
      def: '"P이면 Q이다"와 "Q이다"로부터 "P이다"를 이끌어 내는 부당한 추론.',
      signal: ['P→Q, Q ∴ P', '"~인 경우에만"이 나오면 화살표 방향을 먼저 바로잡는다 (P인 경우에만 Q = Q→P).'],
      example: '식도락가라면 모두 그 음식점을 좋아한다. 그런데 돌이는 그 음식점을 좋아한다. 그러니까 돌이는 식도락가임에 분명하다.' },
    { id: 'affirm-disjunct', name: '선언지 긍정의 오류', aka: [], cat: 'formal', defNote: false,
      def: '"P 또는 Q"와 "P이다"로부터 "Q가 아니다"를 이끌어 내는 부당한 추론. 선언지는 둘 다 참일 수 있다.',
      signal: ['P∨Q, P ∴ ~Q', '"또는" 문장에서 하나를 긍정해 다른 하나를 부정한다.'],
      example: '수사학은 설득술을 가르치거나 사기술을 가르친다. 수사학은 사기술을 가르친다. 그러므로 수사학은 설득술을 가르치지 않는다.' },
    { id: 'forgotten-assumption', name: '가정 망각의 오류', aka: [], cat: 'formal', defNote: true,
      def: '"A라면 B이다. 그러므로 B이다."라고 추론하는 오류. 가정(A)이 성립하는지 확인하지 않고 결론을 내린다.',
      signal: ['"만약 ~라면"이라는 가정만 있고, 그 가정이 참이라는 근거 없이 결론을 확정한다.'],
      example: '만일 모든 존재하는 것이 유기적 관계를 갖는다면 별자리의 이동은 우리의 운명과 관계가 있을 것이다. 그러므로 점성술을 미신으로 여기는 것은 잘못이다.' },

    // ── 무관성의 오류
    { id: 'pity', name: '연민에 호소하는 오류', aka: ['동정에 호소하는 오류'], cat: 'relevance', defNote: false,
      def: '주장의 근거를 제시하는 대신 상대방의 연민(동정심)을 불러일으켜 결론을 받아들이게 하는 오류.',
      signal: ['불쌍한 사정을 늘어놓고 "그러니 ~해 달라".'],
      example: '저는 지난 선거에서 낙선해 전 재산을 날렸고, 어머니는 쓰러져 병원 신세를 지고 계십니다. 저를 불쌍히 여기셔서 이번에는 꼭 밀어주십시오.' },
    { id: 'force', name: '힘에 호소하는 오류', aka: [], cat: 'relevance', defNote: false,
      def: '근거 대신 위협이나 힘(불이익)을 내세워 결론을 받아들이게 하는 오류.',
      signal: ['"그렇지 않으면 ~하게 될 것이다"라는 협박·불이익 암시.'],
      example: '이번에는 우리 회사와 거래하는 것이 좋을 것이다. 그렇지 않으면 당신 회사 제품에 대한 악소문이 돌게 할 것이다.' },
    { id: 'crowd', name: '군중에 호소하는 오류', aka: ['대중에 호소하는 오류'], cat: 'relevance', defNote: false,
      def: '많은 사람이 그렇게 믿거나 행동한다는 것을 근거로 결론을 받아들이게 하는 오류.',
      signal: ['"누구나 다 그렇게 생각한다", "다들 ~한다".'],
      example: '그 사람이 파렴치한 범죄자가 아니라고? 누구나 다 그렇게 생각하는데?' },
    { id: 'authority', name: '권위에 호소하는 오류', aka: [], cat: 'relevance', defNote: false,
      def: '해당 문제와 관련 없는(또는 부적절한) 권위를 근거로 주장을 받아들이게 하는 오류.',
      signal: ['"~선생님(유명인)이 그렇게 말했다"가 유일한 근거이고, 그 사람이 그 분야의 적절한 권위가 아니다.'],
      example: '파이가 유리수로 간주될 날이 올 것이다. 우리 수학 선생님께서 그렇게 말씀하셨다.' },
    { id: 'ad-hominem', name: '인신공격의 오류', aka: [], cat: 'relevance', defNote: true,
      def: '어떤 주장을 비판하기 위해서 그 주장을 한 사람의 행적이나 직업, 그리고 인종적 배경이나 학력 등을 근거로 제시하는 오류.',
      signal: ['주장 내용 대신 말한 사람의 됨됨이·과거 행적·학력·직업을 깎아내린다.'],
      example: '금광석 의원이 제출한 법안은 거부되어야 한다. 그는 몇 년 전 뇌물 수수로 유죄 판결을 받은 부패한 정치인이기 때문이다.' },
    { id: 'circumstantial', name: '정황적 오류', aka: [], cat: 'relevance', defNote: true,
      def: '어떤 사람의 주장을 그 내용과 관련된 근거를 제시하는 대신 그 사람이 처해 있는 상황이나 주변 정황을 근거로 제시할 때 발생하는 오류.',
      signal: ['"그 사람은 그 처지(이해관계)에서 그렇게 말할 수밖에 없다."'],
      example: '이공계 우대정책이 필수적이라는 고정민 교수의 주장은 논의할 필요도 없다. 그녀는 이 정책으로 혜택을 입게 될 공대 교수가 아니던가?' },
    { id: 'tu-quoque', name: '피장파장의 오류', aka: [], cat: 'relevance', defNote: true,
      def: '어떤 주장을 하는 사람도 그 주장과 비슷한 잘못을 과거에 한 적이 있다는 근거를 들어 그 주장을 비판하는 오류.',
      signal: ['"너도 그랬잖아", "당신도 마찬가지 아니냐".'],
      example: '네가 나를 정직하지 않다고 비난하는 것은 잘못이야. 나도 세금 신고를 허위로 했지만, 너도 지금까지 장부를 허위로 기재했잖아?' },
    { id: 'ignorance', name: '무지에 호소하는 오류', aka: [], cat: 'relevance', defNote: true,
      def: '어떤 주장이 참이라는 것이 증명되지 않았기 때문에 그 주장이 거짓이라고 주장하거나, 거짓이라는 것이 증명되지 않았기 때문에 참이라고 주장하는 오류.',
      signal: ['"~라는 증거가 없다. 그러므로 ~가 아니다(맞다)."'],
      example: '유전자 조작 기술이 위험하다고 우려하는 것은 잘못이다. 지금까지 그것이 위험하다는 것을 보여 준 어떤 증거도 없기 때문이다.' },
    { id: 'straw-man', name: '허수아비 논증의 오류', aka: ['허수아비 공격의 오류'], cat: 'relevance', defNote: true,
      def: '상대의 주장을 과대해석(왜곡)한 뒤 그 해석을 비판하는 오류.',
      signal: ['상대가 하지 않은 극단적인 주장으로 바꿔 놓고 공격한다.'],
      example: '황자연 칼럼니스트는 경제 발전이 가장 중요한 것은 아니라고 주장한다. 배울 만큼 배운 사람이 원시로 돌아가자는 무식한 주장을 하다니 개탄스럽다.' },
    { id: 'red-herring', name: '논점 일탈의 오류', aka: [], cat: 'relevance', defNote: true,
      def: '어떤 주장을 하기 위해서 그 주장의 근거를 직접 제시하지 않고 다른 결론을 세워 그 결론을 주장하는 오류.',
      signal: ['원래 결론("바람직하다")과 다른 결론("필연적이다", "이미 진행 중이다")을 근거처럼 늘어놓는다.'],
      example: '물론 사회주의가 바람직하다. 효용이 점점 정부 소유로 바뀌고 있고, 우리는 사회주의로 향하는 도상에 있으며, 사회주의의 승리는 필연적이다.' },
    { id: 'genetic', name: '발생적 오류', aka: [], cat: 'relevance', defNote: true,
      def: '주장의 기원(출처·발생 과정)을 문제 삼아 주장을 무시하거나 받아들이는 오류.',
      signal: ['"그 생각은 ~에서 나온 것이니 틀렸다(옳다)" — 내용이 아니라 출신·유래를 근거로 삼는다.'],
      example: '그 다이어트 이론은 원래 한 식품 회사의 광고 문구에서 시작되었다. 그러니 그 이론은 틀린 것이 분명하다.' },

    // ── 귀납 관련 오류
    { id: 'hasty', name: '성급한 일반화의 오류', aka: [], cat: 'inductive', defNote: false,
      def: '충분하지 않은(너무 적은) 사례를 근거로 전체에 대한 일반적인 결론을 내리는 오류.',
      signal: ['"내가 만나 본 몇 사람이 모두 그랬다 → 그 집단 전체가 그렇다".'],
      example: '충청도 사람은 동작이 굼뜨다. 내가 만나 본 다섯 사람 모두 그랬다.' },
    { id: 'biased-sample', name: '편향된 표본의 오류', aka: ['편향된 자료의 오류'], cat: 'inductive', defNote: false,
      def: '전체를 대표하지 못하는, 한쪽으로 치우친 표본(자료)을 근거로 일반화하는 오류.',
      signal: ['표본 수는 많아도 특정 집단에 쏠려 있다 (예: 아파트 소유자만 조사해 국민 전체를 판단).'],
      example: '무작위로 선택된 아파트 소유자 수천 명 중 80%가 보유세 인상에 반대했다. 그러므로 보유세 인상은 대대적인 국민적 저항에 부딪힐 것이다.' },
    { id: 'vivid', name: '오도된 생생함의 오류', aka: [], cat: 'inductive', defNote: false,
      def: '충분한 자료(통계)가 있는데도 생생하고 인상적인 소수의 사례에 이끌려 결론을 내리는 오류.',
      signal: ['조사한 자료와 반대로, 강렬한 뉴스·목격담 하나 때문에 판단을 바꾼다.'],
      example: '여러 자료를 찾아보고 안전한 GM사 자동차를 사려던 차에, TV에서 GM 자동차의 안전성을 비판하는 뉴스를 보고 마음을 바꾸었다.' },
    { id: 'false-analogy', name: '잘못된 유비의 오류', aka: ['유비의 오류'], cat: 'inductive', defNote: false,
      def: '비교 대상들 사이의 유사성이 결론과 관련이 없거나 불충분한데도, 한쪽이 가진 성질을 다른 쪽도 가질 것이라고 추론하는 오류.',

      if (!p.intro || p.intro.day !== today) p.intro = { day: today, count: 0 };
      p.intro.count += 1;
    }
    const base = rec.b || 1;
    let b;
    if (!correct) b = 1;
    else if (confidence === 'sure') b = Math.min(5, base + 1);
    else b = base < 2 ? base + 1 : base;
    const h = (rec.h || []).concat([{ t: now.getTime(), c: correct ? 1 : 0, k: (confidence || 's')[0], x: chosen || null }]).slice(-6);
    p.items[item.id] = { b, due: today + intervalFor(b, daysLeft(p.settings, now)), h };
    if (!correct && chosen) {
      const k = item.f + '|' + chosen;
      p.conf[k] = (p.conf[k] || 0) + 1;
    }
    p.updatedAt = Math.max(now.getTime(), (p.updatedAt || 0) + 1);
    return { correct };
  }

  // 완전 랜덤 출제: 켜 둔 문항 전체에서 n개를 고르게 뽑는다 (과거 기록과 무관).
  function randomSession(items, n, rng = Math.random) {
    return shuffle(items, rng).slice(0, Math.max(0, n | 0));
  }

  function masteryOf(p, fid, items) {
    const hist = [];
    for (const it of items) {
      if (it.f !== fid) continue;
      const r = p.items[it.id];
      if (r && r.h) hist.push(...r.h);
    }
    hist.sort((a, b) => b.t - a.t);
    const last = hist.slice(0, 5);
    const n = last.length;
    if (!n) return { level: 'none', acc: 0, n: 0 };
    const acc = last.reduce((s, h) => s + h.c, 0) / n;
    return { level: acc < 0.5 ? 'low' : acc < 0.8 ? 'mid' : 'high', acc, n };
  }

  function shuffle(arr, rng) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function pairKey(a, b) { return [a, b].sort().join('|'); }

  function clusterMates(Fx, fid) {
    const out = [];
    for (const c of Fx.clusters) if (c.members.includes(fid)) for (const m of c.members) if (m !== fid && !out.includes(m)) out.push(m);
    return out;
  }

  function enabledFallacies(Fx, settings) {
    const cats = (settings && settings.cats) || ALL_CATS;
    return Fx.fallacies.filter(f => cats.includes(f.cat)).map(f => f.id);
  }

  function pickChoices(item, Fx, { count = 5, rng = Math.random, enabled } = {}) {
    const pool = (enabled || Fx.fallacies.map(f => f.id)).filter(id => id !== item.f);
    if (count - 1 >= pool.length) return shuffle([item.f, ...pool], rng);
    const poolSet = new Set(pool);
    const preferred = [];
    for (const id of [...Object.keys(item.not || {}), ...shuffle(clusterMates(Fx, item.f), rng)])
      if (poolSet.has(id) && !preferred.includes(id)) preferred.push(id);
    const takeNear = Math.min(preferred.length, 3, Math.max(0, count - 2));
    const picked = preferred.slice(0, takeNear);
    const rest = shuffle(pool.filter(id => !picked.includes(id)), rng);
    while (picked.length < count - 1 && rest.length) picked.push(rest.shift());
    return shuffle([item.f, ...picked], rng);
  }

  function weightedPick(ids, weightOf, rng) {
    const total = ids.reduce((s, id) => s + weightOf(id), 0);
    let r = rng() * total;
    for (const id of ids) { r -= weightOf(id); if (r < 0) return id; }
    return ids[ids.length - 1];
  }

  function buildMatchingSet(Fx, p, { n = 8, m = 12, rng = Math.random, enabled, reuse = false, items } = {}) {
    const bank = items || Fx.items || [];
    const enabledIds = enabled || enabledFallacies(Fx, p.settings);
    const byF = {};
    for (const it of bank) if (enabledIds.includes(it.f)) (byF[it.f] = byF[it.f] || []).push(it);
    const avail = enabledIds.filter(id => byF[id]);
    n = Math.max(0, Math.min(n, avail.length));
    const weightOf = () => 1; // 완전 랜덤: 정답률이나 풀이 기록에 따라 가중치를 두지 않는다

    const chosen = [];
    const numClusters = n >= 7 ? 3 : n >= 4 ? 2 : n >= 2 ? 1 : 0;
    for (let k = 0; k < numClusters && chosen.length + 2 <= n; k++) {
      const cands = Fx.clusters.filter(c => c.members.filter(x => avail.includes(x) && !chosen.includes(x)).length >= 2);
      if (!cands.length) break;
      const cw = c => c.members.filter(x => avail.includes(x) && !chosen.includes(x)).reduce((s, x) => s + weightOf(x), 0);
      const total = cands.reduce((s, c) => s + cw(c), 0);
      let r = rng() * total;
      let pick = cands[cands.length - 1];
      for (const c of cands) { r -= cw(c); if (r < 0) { pick = c; break; } }
      for (let t = 0; t < 2; t++) {
        const mem = pick.members.filter(x => avail.includes(x) && !chosen.includes(x));
        chosen.push(weightedPick(mem, weightOf, rng));
      }
    }
    while (chosen.length < n) {
      const rest = avail.filter(x => !chosen.includes(x));
      chosen.push(weightedPick(rest, weightOf, rng));
    }
    if (reuse && n >= 4 && rng() < 0.3) {
      const dupable = chosen.slice(0, -1).filter(id => byF[id].length >= 2);
      if (dupable.length) chosen[chosen.length - 1] = dupable[Math.floor(rng() * dupable.length)];
    }

    const usedItems = new Set();
    const pickItem = fid => {
      const list = byF[fid].filter(it => !usedItems.has(it.id));
      const it = list[Math.floor(rng() * list.length)];
      usedItems.add(it.id);
      return it.id;
    };
    const itemIds = shuffle(chosen.map(pickItem), rng);

    const answers = [...new Set(chosen)];
    const mTarget = Math.max(answers.length, Math.min(m, enabledIds.length));
    const options = answers.slice();
    for (const id of shuffle(answers.flatMap(a => clusterMates(Fx, a)), rng))
      if (options.length < mTarget && enabledIds.includes(id) && !options.includes(id)) options.push(id);
    for (const id of shuffle(enabledIds, rng))
      if (options.length < mTarget && !options.includes(id)) options.push(id);
    return { items: itemIds, options: shuffle(options, rng) };
  }

  function explainNot(item, chosenId, Fx) {
    let against = chosenId && chosenId !== item.f ? chosenId : null;
    if (!against) against = Object.keys(item.not || {})[0] || clusterMates(Fx, item.f)[0] || null;
    if (!against) return null;
    if (item.not && item.not[against]) return { against, text: item.not[against] };
    const k = pairKey(item.f, against);
    for (const c of Fx.clusters) if (c.pairs[k]) return { against, text: c.pairs[k] };
    const A = Fx.fallacyById[item.f];
    const B = Fx.fallacyById[against];
    return { against, text: `${B.name}은(는) "${B.def}" 이 논증은 그렇지 않고, ${A.name}의 특징("${A.signal[0]}")을 보인다.` };
  }

  function topConfusions(p, k = 5) {
    return Object.entries(p.conf || {})
      .map(([key, count]) => { const [answer, chosen] = key.split('|'); return { answer, chosen, count }; })
      .sort((a, b) => b.count - a.count)
      .slice(0, k);
  }

  function guessStats(p) {
    let correctTotal = 0;
    let luckyCount = 0;
    for (const r of Object.values(p.items || {})) for (const h of r.h || []) if (h.c) { correctTotal++; if (h.k === 'g' || h.k === 'u') luckyCount++; }
    return { correctTotal, luckyCount };
  }

  function fillDefaults(p) {
    const d = newProgress();
    if (!p.items || typeof p.items !== 'object') p.items = {};
    if (!p.conf || typeof p.conf !== 'object') p.conf = {};
    if (!p.intro || typeof p.intro !== 'object') p.intro = d.intro;
    p.settings = Object.assign(d.settings, p.settings || {});
    p.updatedAt = Number(p.updatedAt) || 0;
    p.v = 1;
    return p;
  }

  function mergeProgress(a, b) {
    const pick = !a ? b : !b ? a : (b.updatedAt || 0) > (a.updatedAt || 0) ? b : a;
    return pick ? fillDefaults(pick) : null;
  }

  FT.core = { INTERVALS, ALL_CATS, newProgress, fillDefaults, dayNum, daysLeft, intervalFor, applyAnswer, randomSession,
    masteryOf, shuffle, pairKey, clusterMates, enabledFallacies, pickChoices, buildMatchingSet, explainNot,
    topConfusions, guessStats, mergeProgress };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* 진행 기록 저장: localStorage(즉시) + Artifact db 사용자별 비공개 문서(디바운스, 직렬화).
   db를 쓸 수 없으면(로그아웃·미허용·파일로 열기) 브라우저 저장만, 그것도 막히면 메모리만 사용한다. */
(function (g) {
  const FT = (g.FT = g.FT || {});
  const KEY = 'ft-progress-v1';
  let mode = 'memory';
  let localOk = false;
  let docRef = null;
  let debounce = null;
  let pending = null;
  let chain = Promise.resolve();
  let latest = null;
  const listeners = [];

  function setMode(m) { mode = m; for (const f of listeners) f(m); }

  function readLocal() {
    try { const s = g.localStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; }
  }
  function writeLocal(p) {
    try { g.localStorage.setItem(KEY, JSON.stringify(p)); return true; } catch (e) { return false; }
  }
  function probeLocal() {
    try { g.localStorage.setItem(KEY + '-probe', '1'); g.localStorage.removeItem(KEY + '-probe'); return true; } catch (e) { return false; }
  }
  function timeout(promise, ms) {
    return Promise.race([promise, new Promise(resolve => setTimeout(() => resolve(null), ms))]);
  }

  function init() {
    localOk = probeLocal();
    setMode(localOk ? 'local' : 'memory');
    latest = FT.core.mergeProgress(readLocal(), null) || FT.core.newProgress();
    return latest;
  }

  // onRemoteNewer(progress) is called only when the cloud copy is newer than what is on screen.
  async function connectCloud(onRemoteNewer) {
    if (!g.claude || typeof g.claude.use !== 'function') return;
    try {
      const pair = await timeout(Promise.all([g.claude.use('db'), g.claude.use('user')]), 10000);
      if (!pair || !pair[0] || !pair[1]) return;
      const uid = await pair[1].id();
      if (!uid) return;
      const ref = pair[0].doc('data/users/' + uid + '/progress');
      const snap = await timeout(ref.get(), 10000);
      if (!snap) return;
      docRef = ref;
      setMode('cloud');
      const body = snap.exists ? snap.data() : null;
      let remote = null;
      try { remote = body && typeof body.json === 'string' ? JSON.parse(body.json) : null; } catch (e) { remote = null; }
      if (remote && (remote.updatedAt || 0) > (latest.updatedAt || 0)) {
        latest = FT.core.mergeProgress(remote, null);
        writeLocal(latest);
        onRemoteNewer(latest);
      } else if (!remote || (latest.updatedAt || 0) > (remote.updatedAt || 0)) {
        queueCloud(latest);
      }
    } catch (e) { /* 클라우드를 못 쓰면 로컬 모드 유지 */ }
  }

  function queueCloud(p) {
    if (!docRef) return;
    pending = p;
    chain = chain.then(async () => {
      if (!pending || !docRef) return;
      const body = { json: JSON.stringify(pending), updatedAt: pending.updatedAt || 0 };
      pending = null;
      try { await docRef.set(body); } catch (e) { docRef = null; setMode(localOk ? 'local' : 'memory'); }
    });
  }

  function save(p) {
    latest = p;
    if (localOk && !writeLocal(p)) { localOk = false; if (!docRef) setMode('memory'); }
    if (!docRef) return;
    clearTimeout(debounce);
    debounce = setTimeout(() => queueCloud(latest), 1500);
  }

  function flush() {
    if (docRef && latest) { clearTimeout(debounce); queueCloud(latest); }
  }

  function exportText(p) { return JSON.stringify(p); }

  function importText(text) {
    let p;
    try { p = JSON.parse(String(text).trim()); } catch (e) { throw new Error('붙여 넣은 내용이 백업 형식(JSON)이 아닙니다. 내보내기로 복사한 글자를 빠짐없이 붙여 넣어 주세요.'); }
    if (!p || p.v !== 1 || typeof p.items !== 'object') throw new Error('이 앱의 백업이 아닙니다. 내보내기 화면에서 복사한 내용인지 확인해 주세요.');
    p = FT.core.mergeProgress(p, null);
    p.updatedAt = Date.now();
    return p;
  }

  function onMode(f) { listeners.push(f); f(mode); }

  if (g.addEventListener) g.addEventListener('visibilitychange', () => { if (g.document && g.document.visibilityState === 'hidden') flush(); });

  FT.store = { init, connectCloud, save, flush, exportText, importText, onMode, get mode() { return mode; } };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* UI: 해시 라우팅 + 화면별 렌더 함수. 모든 텍스트는 textContent로 넣는다. */
(function () {
  'use strict';
  const FT = window.FT;
  const C = FT.core;
  const S = FT.store;
  const F = FT.fallacyById;
  const ITEMS = FT.items;
  const itemById = {};
  for (const it of ITEMS) itemById[it.id] = it;
  const CAT = {};
  for (const c of FT.categories) CAT[c.id] = c;
  const LABELS = 'ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌㅍㅎ'.split('');
  const NAV = { cardFocus: null, duelCluster: null };
  const $view = document.getElementById('view');
  const $sheet = document.getElementById('sheet');
  let P = S.init();
  let leaveFns = [];
  let KEY = null;

  // ───────────────────────── helpers
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) for (const k of Object.keys(attrs)) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, '');
      else el.setAttribute(k, String(v));
    }
    for (const kid of kids.flat(3)) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    return el;
  }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
  function onLeave(fn) { leaveFns.push(fn); }
  function go(name) { if (location.hash === '#' + name) render(); else location.hash = name; }
  function link(name, label, cls) { return h('a', { class: cls || 'btn', href: '#' + name, text: label }); }
  function btn(label, onClick, cls, attrs) {
    const b = h('button', Object.assign({ class: cls || 'btn', type: 'button', text: label }, attrs || {}));
    b.addEventListener('click', onClick);
    return b;
  }
  function rng() { return Math.random(); }
  function shuffle(a) { return C.shuffle(a, rng); }
  function enabledIds() { return C.enabledFallacies(FT, P.settings); }
  function enabledItems() { const s = new Set(enabledIds()); return ITEMS.filter(i => s.has(i.f)); }
  function touch() { P.updatedAt = Math.max(Date.now(), (P.updatedAt || 0) + 1); S.save(P); }
  function record(item, chosen, confidence) {
    const r = C.applyAnswer(P, item, { chosen: chosen || null, confidence, now: new Date() });
    S.save(P);
    return r.correct;
  }
  function mastery(fid) { return C.masteryOf(P, fid, ITEMS); }
  function fmtTime(sec) { const m = Math.floor(sec / 60); const s = sec % 60; return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0'); }
  function pct(x) { return Math.round(x * 100) + '%'; }
  function srcBadge(item) {
    if (item.src === 'note') return h('span', { class: 'badge note', text: '노트' });
    return h('span', { class: 'badge', text: item.src === 'var' ? '변형' : '신규' });
  }
  function ticker(el, countdownSec, onEnd) {
    const start = Date.now();
    let stopped = false;
    const tick = () => {
      if (stopped) return;
      const s = Math.floor((Date.now() - start) / 1000);
      if (countdownSec != null) {
        const left = Math.max(0, countdownSec - s);
        el.textContent = fmtTime(left);
        if (left === 0) { stopped = true; clearInterval(id); if (onEnd) onEnd(); }
      } else el.textContent = fmtTime(s);
    };
    const id = setInterval(tick, 250);
    tick();
    onLeave(() => clearInterval(id));
    return { stop() { stopped = true; clearInterval(id); return Math.floor((Date.now() - start) / 1000); } };
  }

  // ───────────────────────── passage + speech bubble
  function passage(item, highlight) {
    const p = h('p', { class: 'passage' });
    fillPassage(p, item, highlight);
    return p;
  }
  function fillPassage(p, item, highlight) {
    clear(p);
    if (!highlight || !item.cue) { p.textContent = item.text; return; }
    const parts = item.text.split(item.cue);
    parts.forEach((part, i) => {
      if (part) p.append(document.createTextNode(part));
      if (i < parts.length - 1) p.append(h('mark', { text: item.cue }));
    });
  }

  function bubble(item, chosen) {
    const f = F[item.f];
    const wrong = chosen && chosen !== item.f;
    const ex = C.explainNot(item, chosen, FT);
    const ans = h('dl', { class: 'ans' }, h('dt', { text: '정답' }), h('dd', { class: 'ok', text: f.name + ' · ' + CAT[f.cat].short }));
    if (wrong) ans.append(h('dt', { text: '내 답' }), h('dd', { class: 'bad', text: F[chosen].name }));
    else if (chosen === null) ans.append(h('dt', { text: '내 답' }), h('dd', { class: 'bad', text: '비워 둠' }));
    const b = h('div', { class: 'bubble', role: 'note' }, ans, h('h4', { text: '왜 오류인가' }), h('p', { text: item.why }));
    if (ex) b.append(h('h4', { text: '왜 ' + F[ex.against].name + '가 아닌가' }), h('p', { text: ex.text }));
    const cardLink = btn('단서 카드 보기 ▸', () => { NAV.cardFocus = item.f; go('cards'); }, 'btn ghost');
    b.append(h('div', { class: 'foot' }, h('span', { class: 'small muted' }, srcBadge(item), ' ', item.ref || ''), cardLink));
    return b;
  }

  const BUB = { host: null, el: null, restore: null };
  function openBubble(host, after, item, chosen, pEl) {
    closeBubble();
    const b = bubble(item, chosen);
    after.after(b);
    if (pEl) fillPassage(pEl, item, true);
    BUB.host = host; BUB.el = b; BUB.restore = pEl ? () => fillPassage(pEl, item, false) : null;
  }
  function closeBubble() {
    if (BUB.el) { BUB.el.remove(); if (BUB.restore) BUB.restore(); }
    BUB.host = null; BUB.el = null; BUB.restore = null;
  }
  document.addEventListener('click', e => {
    if (!BUB.el) return;
    if (!document.contains(e.target)) return; // the clicked control was removed while handling the click
    if (BUB.el.contains(e.target)) return;
    if (BUB.host && BUB.host.contains(e.target)) return;
    if ($sheet.contains(e.target)) return;
    closeBubble();
  });
  document.addEventListener('keydown', e => {
    if (!KEY) return;
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT')) return;
    KEY(e);
  });

  // A finished question shown as a row; tapping toggles its bubble.
  function reviewRow(item, chosen, n, correct) {
    const pEl = passage(item, false);
    const row = h('div', { class: 'qrow ' + (correct ? 'is-ok' : 'is-bad'), 'data-item': item.id },
      h('span', { class: 'qn', text: String(n) }), pEl, h('span', { class: 'slot', text: correct ? '✓' : '✗' }));
    row.addEventListener('click', e => {
      if (BUB.el && BUB.el.contains(e.target)) return;
      if (BUB.host === row) closeBubble(); else openBubble(row, pEl, item, chosen, pEl);
    });
    return row;
  }

  // ───────────────────────── single-question quiz engine
  function defaultChoices(item) {
    const enabled = enabledIds().includes(item.f) ? enabledIds() : FT.fallacies.map(f => f.id);
    const count = P.settings.choices === 'all' ? Infinity : 5;
    return C.pickChoices(item, FT, { count, rng, enabled });
  }

  function runQuiz(root, queue, opts) {
    opts = opts || {};
    const results = [];
    let i = 0;
    const box = h('div', { class: 'stack' });
    root.append(box);
    show();

    function show() {
      clear(box);
      closeBubble();
      if (i >= queue.length) return done();
      const item = queue[i];
      const ids = (opts.choicesFor || defaultChoices)(item);
      let picked = null;
      let answered = false;
      const pEl = passage(item, false);
      const card = h('section', { class: 'panel stack', 'data-q': item.id });
      const meta = h('div', { class: 'qmeta' }, h('span', { class: 'num', text: (i + 1) + ' / ' + queue.length }), srcBadge(item));
      if (opts.metaExtra) meta.append(opts.metaExtra());
      const list = h('div', { class: 'choices', role: 'group', 'aria-label': '오류 고르기' });
      const confRow = h('div', { class: 'row' }, h('span', { class: 'small muted', text: '고른 답, 얼마나 확신하나요?' }));
      const confBtns = [['sure', '확실해요'], ['unsure', '애매해요'], ['guess', '찍었어요']].map(([k, label]) => {
        const b = btn(label, () => submit(k), k === 'sure' ? 'btn primary' : 'btn', { 'data-conf': k });
        b.disabled = true;
        return b;
      });
      confRow.append(...confBtns);
      const choiceBtns = ids.map((fid, k) => {
        const b = h('button', { class: 'choice', type: 'button', 'aria-pressed': 'false', 'data-fid': fid },
          h('span', { class: 'k', text: String(k + 1) }), h('span', { text: F[fid].name }));
        b.addEventListener('click', () => {
          if (answered) return;
          picked = fid;
          for (const x of choiceBtns) x.setAttribute('aria-pressed', String(x === b));
          for (const c of confBtns) c.disabled = false;
        });
        return b;
      });
      list.append(...choiceBtns);
      const after = h('div', { class: 'row' });
      card.append(meta, pEl, list, confRow, after);
      box.append(h('div', { class: 'progressline' }, h('i', { style: 'width:' + (i / queue.length * 100).toFixed(1) + '%' })), card);

      card.addEventListener('click', e => {
        if (!answered) return;
        if (BUB.el && BUB.el.contains(e.target)) return;
        if (e.target.closest('button')) return;
        if (BUB.host === card) closeBubble(); else openBubble(card, list, item, picked, pEl);
      });
      KEY = e => {
        if (!answered && /^[1-9]$/.test(e.key) && choiceBtns[+e.key - 1]) { choiceBtns[+e.key - 1].click(); e.preventDefault(); }
        else if (!answered && e.key === 'Enter' && picked) { submit('sure'); e.preventDefault(); }
        else if (answered && e.key === 'Enter') { next(); e.preventDefault(); }
      };

      function submit(conf) {
        if (answered || !picked) return;
        answered = true;
        const correct = opts.record === false ? picked === item.f : record(item, picked, conf);
        results.push({ item, chosen: picked, correct, conf });
        for (const b of choiceBtns) {
          b.disabled = true;
          if (b.dataset.fid === item.f) b.classList.add('is-ok');
          else if (b.dataset.fid === picked) b.classList.add('is-bad');
        }
        confRow.remove();
        if (opts.onAnswer) opts.onAnswer(correct, item);
        openBubble(card, list, item, picked, pEl);
        const nextBtn = btn(i + 1 < queue.length ? '다음 문제' : '결과 보기', next, 'btn primary', { id: 'next' });
        after.append(h('span', { class: 'badge ' + (correct ? 'ok' : 'bad'), text: correct ? '정답' : '오답' }),
          h('span', { class: 'small muted', text: '문제를 누르면 해설을 접거나 펼 수 있어요' }), h('span', { class: 'spacer' }), nextBtn);
      }
      function next() { i++; show(); window.scrollTo({ top: 0 }); }
    }

    function done() {
      KEY = null;
      const ok = results.filter(r => r.correct).length;
      const by = k => results.filter(r => r.conf === k).length;
      const panel = h('section', { class: 'panel stack' },
        h('div', { class: 'eyebrow', text: '결과' }),
        h('div', { class: 'row' }, h('span', { class: 'score', text: ok + ' / ' + results.length }),
          h('span', { class: 'muted small', text: '확실 ' + by('sure') + ' · 애매 ' + by('unsure') + ' · 찍음 ' + by('guess') })));
      const lucky = results.filter(r => r.correct && r.conf !== 'sure').length;
      if (lucky) panel.append(h('p', { class: 'banner', text: '맞힌 문제 중 ' + lucky + '개는 애매하거나 찍어서 맞혔어요. 실력으로 굳히려면 해당 오류의 단서 카드를 한 번 더 보세요.' }));
      const actions = h('div', { class: 'row' });
      if (opts.again) actions.append(btn('한 번 더', opts.again, 'btn primary'));
      actions.append(link('home', '홈으로'));
      panel.append(actions);
      box.append(panel);
      const wrongs = results.filter(r => !r.correct);
      if (wrongs.length) {
        box.append(h('h2', { class: 'h3', text: '틀린 문제 (' + wrongs.length + ') — 누르면 해설' }));
        wrongs.forEach((r, k) => box.append(reviewRow(r.item, r.chosen, k + 1, false)));
      }
      if (opts.onDone) opts.onDone(results);
    }
  }

  // ───────────────────────── matching board (exam format)
  function matchBoard(root, set, opts) {
    opts = opts || {};
    const items = set.items.map(id => itemById[id]);
    const options = set.options;
    const label = fid => LABELS[options.indexOf(fid)] || '?';
    const reuse = !!opts.reuse;
    const assign = {};
    const locked = new Set();
    let active = null;
    let phase = 'answer';
    let first = null;

    const bogiList = h('div', { class: 'bogi-list' });
    const bogi = h('div', { class: 'bogi' }, h('span', { class: 'bogi-title', text: '〈보기〉' }), bogiList);
    const status = h('div', { class: 'row small muted' });
    const bannerBox = h('div');
    const rowsBox = h('div', { class: 'stack' });
    const actions = h('div', { class: 'row' });
    root.append(bogi, status, bannerBox, rowsBox, actions);

    const rows = items.map((it, i) => {
      const pEl = passage(it, false);
      const slot = h('span', { class: 'slot', 'aria-label': '논제 ' + (i + 1) + '의 답' });
      const hint = h('span', { class: 'hint' });
      hint.hidden = true;
      const row = h('div', { class: 'qrow', 'data-i': String(i), role: 'button', tabindex: '0' },
        h('span', { class: 'qn', text: String(i + 1) }), pEl, slot, hint);
      row.addEventListener('click', e => {
        if (BUB.el && BUB.el.contains(e.target)) return;
        if (phase === 'done') {
          if (opts.noReveal) return;
          const chosen = first ? first[i].chosen : assign[i];
          if (BUB.host === row) closeBubble(); else openBubble(row, hint, it, chosen === undefined ? null : chosen, pEl);
          return;
        }
        if (locked.has(i)) return;
        setActive(i);
      });
      row.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); row.click(); } });
      rowsBox.append(row);
      return { row, slot, hint, pEl };
    });

    function usedBy(fid, except) {
      for (const k of Object.keys(assign)) if (+k !== except && assign[k] === fid) return true;
      return false;
    }
    function setActive(i) { active = i; refresh(); openSheet(); rows[i].row.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
    function nextOpen(from) {
      for (let s = 1; s <= items.length; s++) {
        const j = (from + s) % items.length;
        if (!locked.has(j) && !assign[j]) return j;
      }
      return null;
    }
    function openSheet() {
      if (active == null) return closeSheet();
      clear($sheet);
      const grid = h('div', { class: 'sheet-grid' });
      for (const fid of options) {
        const b = h('button', { type: 'button', 'data-fid': fid }, h('b', { text: label(fid) }), h('span', { text: F[fid].name }));
        if (!reuse && usedBy(fid, active)) b.disabled = true;
        if (assign[active] === fid) b.setAttribute('aria-pressed', 'true');
        b.addEventListener('click', () => {
          assign[active] = fid;
          const nxt = nextOpen(active);
          if (nxt == null) { active = null; closeSheet(); } else { active = nxt; openSheet(); }
          refresh();
        });
        grid.append(b);
      }
      const head = h('div', { class: 'row' }, h('b', { text: '논제 ' + (active + 1) + '에 넣을 보기' }), h('span', { class: 'spacer' }),
        assign[active] ? btn('비우기', () => { delete assign[active]; openSheet(); refresh(); }, 'btn ghost') : null,
        btn('닫기', () => { active = null; closeSheet(); refresh(); }, 'btn'));
      $sheet.append(h('div', { class: 'sheet-in' }, head, grid));
      $sheet.hidden = false;
    }

    function refresh() {
      clear(bogiList);
      for (const fid of options) {
        const used = !reuse && Object.values(assign).includes(fid) && phase !== 'done';
        bogiList.append(h('span', { class: used ? 'used' : null }, h('b', { text: label(fid) }), F[fid].name));
      }
      rows.forEach((r, i) => {
        const fid = assign[i];
        r.row.classList.toggle('active', active === i);
        r.slot.textContent = fid ? label(fid) : '　';
        r.slot.classList.toggle('filled', !!fid);
        r.row.classList.remove('is-ok', 'is-bad');
        r.hint.hidden = true;
        if (phase === 'retry' && locked.has(i)) r.row.classList.add('is-ok');
        if (phase === 'done' && !opts.noReveal) {
          const ok = assign[i] === items[i].f;
          r.row.classList.add(ok ? 'is-ok' : 'is-bad');
          if (!ok) r.slot.textContent = (fid ? label(fid) : '—') + '→' + label(items[i].f);
          const f0 = first && first[i];
          if (f0 && !f0.correct && ok) { r.hint.hidden = false; r.hint.textContent = '첫 시도 ' + (f0.chosen ? label(f0.chosen) + ' ' + F[f0.chosen].name : '비워 둠') + ' → 재도전에서 맞힘'; }
          else if (!opts.noReveal) { r.hint.hidden = false; r.hint.textContent = '눌러서 해설 보기'; }
        }
      });
      const filled = items.filter((_, i) => locked.has(i) || assign[i]).length;
      clear(status);
      if (phase === 'answer') status.append('배정 ' + filled + ' / ' + items.length + ' · 논제를 누른 뒤 아래에서 보기를 고르세요');
      else if (phase === 'retry') status.append('틀린 논제만 다시 고르세요 · 맞힌 논제는 잠겨 있어요');
      clear(actions);
      if (phase !== 'done') {
        const g = btn(phase === 'retry' ? '다시 채점' : '채점하기', () => grade(false), 'btn primary', { id: 'grade' });
        g.disabled = filled < items.length;
        actions.append(g);
        if (opts.extraActions) actions.append(...opts.extraActions());
      } else if (opts.doneActions) actions.append(...opts.doneActions());
    }

    function grade(force) {
      closeSheet();
      active = null;
      const res = items.map((it, i) => ({ item: it, chosen: assign[i] || null, correct: assign[i] === it.f }));
      if (!first) {
        first = res;
        if (opts.record !== false) for (const r of res) if (r.chosen || force) record(r.item, r.chosen, 'sure');
      }
      const wrong = res.filter(r => !r.correct).length;
      const firstOk = first.filter(r => r.correct).length;
      clear(bannerBox);
      if (!force && phase === 'answer' && opts.retry && wrong) {
        phase = 'retry';
        res.forEach((r, i) => { if (r.correct) locked.add(i); else delete assign[i]; });
        bannerBox.append(h('p', { class: 'banner', text: '첫 시도 ' + firstOk + ' / ' + items.length + '. 틀린 ' + wrong + '개를 남은 보기로 한 번 더 골라 보세요. 기록은 첫 시도로 남습니다.' }));
      } else {
        phase = 'done';
        const finalOk = res.filter(r => r.correct).length;
        if (!opts.noReveal) {
          const txt = first === res || finalOk === firstOk ? '점수 ' + firstOk + ' / ' + items.length : '첫 시도 ' + firstOk + ' / ' + items.length + ' · 재도전 후 ' + finalOk + ' / ' + items.length;
          bannerBox.append(h('p', { class: 'banner ' + (firstOk === items.length ? 'ok' : ''), text: txt + ' — 논제를 누르면 말풍선으로 해설이 열립니다.' }));
        }
      }
      refresh();
      if (phase === 'done' && opts.onGraded) opts.onGraded(first);
      if (phase !== 'done') { const j = nextOpen(-1); if (j != null) setActive(j); }
    }

    refresh();
    return { grade: () => grade(true), get phase() { return phase; } };
  }
  function closeSheet() { $sheet.hidden = true; clear($sheet); }

  // ───────────────────────── bar
  const $bar = { back: document.getElementById('back'), title: document.getElementById('barTitle'), dday: document.getElementById('dday'),
    save: document.getElementById('save'), saveText: document.getElementById('saveText') };
  $bar.back.addEventListener('click', () => go('home'));
  function setBar(title, back) { $bar.title.textContent = title || ''; $bar.back.hidden = !back; }
  function updateBar() {
    const dl = C.daysLeft(P.settings, new Date());
    $bar.dday.hidden = dl == null;
    if (dl != null) $bar.dday.textContent = dl > 0 ? 'D-' + dl : dl === 0 ? 'D-DAY' : 'D+' + (-dl);
  }
  S.onMode(m => {
    $bar.save.dataset.mode = m;
    $bar.saveText.textContent = { cloud: '계정에 저장', local: '이 브라우저에 저장', memory: '저장 안 됨' }[m] || '';
  });
  function lastWrong(i) { const r = P.items[i.id]; return !!(r && r.h && r.h.length && !r.h[r.h.length - 1].c); }
  function shortName(f) { return f.name.replace(/에 호소하는 오류$/, ' 호소').replace(/의 오류$/, '').replace(/ 오류$/, ''); }
  function pairText(a, b) { const k = C.pairKey(a, b); for (const c of FT.clusters) if (c.pairs[k]) return c.pairs[k]; return ''; }
  function levelVar(lv) { return lv === 'low' ? 'var(--bad)' : lv === 'mid' ? 'var(--mid)' : lv === 'high' ? 'var(--ok)' : 'var(--none)'; }

  // ───────────────────────── home

    const now = new Date();

    const wrongN = ITEMS.filter(lastWrong).length;
    const eyebrow = dl == null ? '랜덤으로 풀기' : dl > 0 ? '시험까지 ' + dl + '일' : dl === 0 ? '오늘이 시험날 · 마지막 점검' : '시험이 끝났어요';

    const today = h('section', { class: 'panel today' },
      h('div', { class: 'stack' },
        h('div', { class: 'eyebrow', text: eyebrow }),
        h('div', { class: 'stats' },
          h('div', null, h('span', { class: 'big', text: seen + '/' + ITEMS.length }), h('span', { class: 'small muted', text: '풀어 본 문항 · 노트 원문 ' + noteSeen + '/' + noteAll.length })),
          h('div', null, h('span', { class: 'big', text: String(wrongN) }), h('span', { class: 'small muted', text: '마지막에 틀린 문항' }))),
        h('p', { class: 'small muted', text: '문제는 켜 둔 범주의 ' + pool.length + '문항 전체에서 매번 무작위로 뽑습니다.' }),
        dl == null ? h('a', { href: '#prefs', class: 'small', text: '시험 날짜를 넣으면 화면 위에 D-day가 표시돼요 →' }) : null),
      h('div', { class: 'stack' },

        wrongN ? btn('틀린 문제 다시 풀기', () => { NAV.drillWrong = true; go('drill'); }, 'btn') : null,

      .map(([lv, t]) => h('span', null, h('i', { style: 'background:' + levelVar(lv) }), t)));

      ['정리 · 점검', [['report', '약점 리포트', '정답률과 자주 헷갈린 짝'], ['summary', '시험 직전 요약', '31개를 한 장에'], ['notecheck', '노트 검증', '내 노트 속 실수 찾기'],
        ['speed', '스피드 라운드', '정의 보고 이름 맞히기 60초'], ['basics', '바탕 개념', '기술·설명·논증, 연역·귀납 등']]],
    ];
    const modeBox = h('div', { class: 'stack' });
    for (const [title, modes] of groups) {
      modeBox.append(h('div', { class: 'group-title', text: title }),
        h('div', { class: 'modes' }, modes.map(([r, name, desc, key]) => h('a', { class: 'mode' + (key ? ' key' : ''), href: '#' + r }, h('b', { text: name }), h('span', { text: desc })))));
    }

    $view.append(
      h('div', { class: 'stack' }, h('div', { class: 'eyebrow', text: '논리학 · 오류 찾기 시험 대비' }), h('h1', { class: 'h1', text: '논제를 읽고, 오류를 맞혀라' })),
      today,

        h('p', { class: 'small muted', text: '칸을 누르면 그 오류의 단서 카드가 열립니다. 색은 최근 5번의 정답률입니다.' }), map),
      modeBox,
      h('div', { class: 'row small' }, link('prefs', '설정 · 백업', 'btn ghost'), h('span', { class: 'muted', text: '문항 ' + ITEMS.length + '개 · 오류 ' + FT.fallacies.length + '개' })));
  }

  // ───────────────────────── cards
  function cards() {
    setBar('단서 카드', true);
    let list = FT.fallacies.slice();
    let idx = NAV.cardFocus ? Math.max(0, list.findIndex(f => f.id === NAV.cardFocus)) : 0;
    NAV.cardFocus = null;
    const catSel = h('select', { id: 'cardCat', 'aria-label': '범주 고르기' }, h('option', { value: '', text: '전체 범주' }),
      FT.categories.map(c => h('option', { value: c.id, text: c.name })));
    const counter = h('span', { class: 'num muted small' });
    const holder = h('div', { class: 'stack' });
    $view.append(h('h1', { class: 'h2', text: '단서 카드' }), h('div', { class: 'row' }, catSel, h('span', { class: 'spacer' }), counter), holder);
    catSel.addEventListener('change', () => { list = catSel.value ? FT.fallacies.filter(f => f.cat === catSel.value) : FT.fallacies.slice(); idx = 0; draw(); });
    draw();

    function draw() {
      clear(holder); closeBubble(); KEY = null;
      const f = list[idx];
      counter.textContent = (idx + 1) + ' / ' + list.length;
      const m = mastery(f.id);
      const mates = C.clusterMates(FT, f.id);
      const card = h('section', { class: 'panel stack' },
        h('div', { class: 'row' }, h('span', { class: 'eyebrow', text: CAT[f.cat].name }), h('span', { class: 'spacer' }),
          h('span', { class: 'badge ' + (m.level === 'high' ? 'ok' : m.level === 'low' ? 'bad' : ''), text: m.n ? '최근 정답률 ' + pct(m.acc) : '아직 안 풀어 봄' })),
        h('h2', { class: 'h1', text: f.name }),
        f.aka.length ? h('p', { class: 'small muted', text: '= ' + f.aka.join(', ') }) : null,
        h('p', { class: 'card-def', text: f.def }),
        h('p', { class: 'small muted', text: f.defNote ? '노트(교재) 정의' : '노트에 정의가 없어 보충한 정의' }),
        h('h3', { class: 'h3', text: '알아보는 신호' }),
        h('ul', { class: 'signals' }, f.signal.map(s => h('li', { text: s }))),
        h('h3', { class: 'h3', text: '대표 예문' }),
        h('p', { class: 'passage', text: f.example }),
        mates.length ? h('h3', { class: 'h3', text: '헷갈리는 오류와 구별' }) : null,
        mates.length ? h('div', { class: 'vs' }, mates.map(mid => h('div', null, h('b', { text: '↔ ' + F[mid].name }), h('span', { text: pairText(f.id, mid) })))) : null);
      holder.append(card, h('div', { class: 'row' },
        btn('← 이전', () => { idx = (idx - 1 + list.length) % list.length; draw(); }),
        btn('다음 →', () => { idx = (idx + 1) % list.length; draw(); }),
        h('span', { class: 'spacer' }),
        btn('이 오류 3문제 풀기', () => mini(f), 'btn primary')));
      KEY = e => { if (e.key === 'ArrowRight') { idx = (idx + 1) % list.length; draw(); } else if (e.key === 'ArrowLeft') { idx = (idx - 1 + list.length) % list.length; draw(); } };
    }
    function mini(f) {
      const own = shuffle(ITEMS.filter(i => i.f === f.id)).slice(0, 2);

        h('tbody', null, forms.map(([, f]) => h('tr', null, h('td', { class: 'name', text: f.name }), h('td', { class: 'mono', text: f.shape }), h('td', { text: f.valid ? '타당' : '부당' })))))),

    function draw() {

      const d = q[k];

        const b = h('button', { class: 'choice', type: 'button', 'data-form': key }, h('span', { class: 'k', text: f.valid ? '○' : '✕' }), h('span', null, f.name, ' ', h('span', { class: 'mono small muted', text: f.shape })));
        b.addEventListener('click', () => {
